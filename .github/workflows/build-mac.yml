# Builds ETTA's macOS universal .dmg (and .zip for future in-place updates) on a macOS runner.
# Unsigned by design (no Apple Developer signing identity yet), so testers will use
# Gatekeeper's "Open Anyway" on first launch. GitHub is used as the macOS build host because
# the repo's Bitbucket already plays that role for Windows and we have no local macOS CI.

name: build-mac

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '*ppmo*'

jobs:
  mac-universal:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Diagnose native module (better-sqlite3)
        run: |
          node -v
          node -p "process.platform + ' ' + process.arch"
          echo '--- main thread ---'
          node -e 'const D=require("better-sqlite3"); const db=new D(":memory:"); db.exec("create table t(x)"); console.log("MAIN_OK"); db.close();' || echo 'MAIN_FAILED'
          echo '--- worker thread ---'
          node -e 'const {Worker}=require("worker_threads"); const w=new Worker(`
            const D=require("better-sqlite3");
            const db=new D(":memory:");
            db.exec("create table t(x)");
            console.log("WORKER_OK");
          `,{eval:true}); w.on("error",e=>{console.error("WORKER_ERR",e.message);process.exit(1)}); w.on("exit",c=>console.log("WORKER_EXIT",c));' || echo 'WORKER_FAILED'

      - name: Lint & typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Build universal macOS artifacts (dmg + zip)
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Confirm universal architecture
        run: |
          APP=$(find artifacts -maxdepth 2 -name '*.app' | head -n1)
          echo "Verifying $APP"
          lipo -archs "$APP/Contents/MacOS/etta-time-tracker" || \
          lipo -archs "$APP/Contents/MacOS/ETTA Time Tracker"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: etta-mac-universal
          path: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
          if-no-files-found: error