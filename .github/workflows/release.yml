# Tag-driven release pipeline for ETTA. On a version tag (v* or *ppmo*) this builds and
# publishes BOTH the Windows NSIS installer and the macOS arm64+x64 packages (dmg + zip)
# to the ETTA GitHub Releases feed (provider: github in electron-builder.json), which is
# what electron-updater uses to deliver in-place updates. macOS signing/notarization is
# intentionally not required here yet (CSC_IDENTITY_AUTO_DISCOVERY=false); add cert
# secrets once the Apple Developer identity is in place.
#
# `prepare-release` runs first so the GitHub Release exists before either OS uploads
# assets, avoiding a concurrent create-on-first-upload race.

name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '*ppmo*'

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create/reuse GitHub release for this tag
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            || echo "release already exists (should not happen on a fresh tag) - continuing"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Build & publish Windows NSIS installer
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload Windows artifacts (backup + manual handoff)
        uses: actions/upload-artifact@v4
        with:
          name: etta-windows-release
          path: |
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/latest.yml
          if-no-files-found: error

  macos:
    needs: prepare-release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Build & publish macOS packages (arm64 + x64, dmg + zip)
        run: |
          for attempt in 1 2 3; do
            echo "--- macOS release attempt $attempt ---"
            if npm run release:mac; then exit 0; fi
          done
          echo "macOS release failed after retries"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload macOS artifacts (backup + manual handoff)
        uses: actions/upload-artifact@v4
        with:
          name: etta-mac-release
          path: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/latest-mac.yml
          if-no-files-found: error